[project]
name = "legalrag"
version = "0.1.0"
description = "Trợ lý pháp luật Việt Nam bằng Agentic RAG, có trích dẫn tới Điều/Khoản và eval cho từng thành phần."
authors = [
    { name = "nvtoan0201-swe", email = "nvtoan0201@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.16",
    "datasets>=3.0",
    "duckdb>=2.0.0",
    "fastapi>=0.163.0",
    "langgraph>=1.2.22",
    "lxml>=6.1.3",
    "openai>=3.49.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
ml = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[tool.uv]
# torch + sentence-transformers are only needed to build the index and run the models;
# CI skips them (`uv sync --no-group ml`): tests use fake embedders / rerankers.
default-groups = ["dev", "ml"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Script sinh báo cáo chứa nhiều chuỗi markdown tiếng Việt dài.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
