[project]
name = "legalrag"
version = "0.1.0"
description = "Trợ lý pháp luật Việt Nam bằng Agentic RAG, có trích dẫn tới Điều/Khoản và eval cho từng thành phần."
authors = [
    { name = "nvtoan0201-swe", email = "nvtoan0201@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
